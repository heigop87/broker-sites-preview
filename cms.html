<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Broker Website CMS</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Figtree:wght@400;500;600&family=DM+Serif+Display&family=Manrope:wght@400;600&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;600&family=Playfair+Display:wght@500;600&family=Source+Sans+3:wght@400;600&family=Archivo:wght@600;700&display=swap">
<style>
/* EasySign V2 HIG tokens (hig/tokens.ts), light only */
:root{
  --bg:#f2f2f5;--group:#fff;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);
  --label:#121216;--label2:#727279;--label3:#8c8c92;--sep:rgba(60,60,67,.16);
  --tint:#4b0ea3;--red:#b42318;--redF:#fee4e2;--orange:#b54708;--orangeF:#fef0c7;
  --green:#027a48;--greenF:#d1fadf;--blue:#175cd3;--blueF:#d1e9ff;--slate:#363f72;--slateF:#eaecf5;
  --chrome:rgba(249,249,251,.85);
  --title:Poppins,system-ui,sans-serif;--text:Figtree,system-ui,sans-serif;
  --r-ctl:12px;--r-grp:16px;--r-sheet:20px;--tap:44px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{font:400 17px/22px var(--text);color:var(--label);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--label);outline-offset:2px}
.t1{font:500 28px/34px var(--title);letter-spacing:-.015em}
.lt{font:500 34px/41px var(--title);letter-spacing:-.02em}
.t3{font:500 20px/25px var(--title)}
.hl{font-weight:600}
.sub{font-size:15px;line-height:20px}
.fn{font-size:13px;line-height:18px}
.cap{font-size:12px;line-height:16px}
.m2{color:var(--label2)}.m3{color:var(--label3)}

/* Shell: sidebar from 1024, tab bar below */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.rail{display:none}
@media (min-width:1024px){
  .app{grid-template-columns:264px 1fr}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:20px 12px;background:var(--chrome);border-right:1px solid var(--sep);backdrop-filter:blur(20px)}
  .tabbar{display:none!important}
  .topbar{display:none!important}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 20px}
.brand img{width:28px;height:28px;border-radius:8px}
.brand b{font:600 17px var(--title)}
.brand span{display:block;font-size:12px;color:var(--label2);font-weight:400}
.nav{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:0 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--label)}
.nav svg{width:20px;height:20px;color:var(--label2)}
.nav:hover{background:var(--fill)}
.nav[aria-current=page]{background:var(--group);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nav[aria-current=page] svg{color:var(--label)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--label);color:#fff;border-radius:999px;padding:1px 7px}
.rail .grow{flex:1}
.rail .who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px}
.rail .who img{width:32px;height:32px;border-radius:50%;object-fit:cover}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--chrome);backdrop-filter:blur(20px);border-bottom:1px solid var(--sep)}
.topbar b{font:600 17px var(--title)}
.tabbar{position:fixed;inset:auto 0 0 0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px max(6px,env(safe-area-inset-bottom));background:var(--chrome);backdrop-filter:blur(20px);border-top:1px solid var(--sep)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;font-size:10px;font-weight:500;color:var(--label3);position:relative}
.tabbar svg{width:24px;height:24px}
.tabbar a[aria-current=page]{color:var(--label)}
.tabbar .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}

main{min-width:0;padding:24px 16px 120px}
@media (min-width:744px){main{padding:32px 32px 120px}}
@media (min-width:1024px){main{padding:40px 48px 80px}}
.col{max-width:720px;margin:0 auto}
.split{display:grid;gap:32px;max-width:1280px;margin:0 auto}
@media (min-width:1200px){.split{grid-template-columns:minmax(0,1fr) 440px}.split .col{margin:0;max-width:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.head p{margin-top:4px}

/* Grouped sections and rows */
.sec{margin-bottom:32px}
.sec>h2{font-size:13px;line-height:18px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;padding:0 16px 8px}
.sec>.foot{font-size:13px;line-height:18px;color:var(--label2);padding:8px 16px 0}
.grp{background:var(--group);border-radius:var(--r-grp);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:11px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.row.ic+.row::before,.row+.row.ic::before{left:60px}
button.row:hover,a.row:hover{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .main .t{font-size:17px;line-height:22px}
.row .main .d{font-size:15px;line-height:20px;color:var(--label2);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.row .trail{display:flex;align-items:center;gap:8px;color:var(--label2);font-size:15px;flex:0 0 auto}
.chev{width:8px;height:14px;color:var(--label3)}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;background:var(--fill)}
.ico svg{width:18px;height:18px}
.thumb{width:64px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--fill)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.initial{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--slateF);color:var(--slate);font-weight:600;font-size:15px;flex:0 0 auto}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 20px;border-radius:var(--r-ctl);font-size:17px;font-weight:600;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--label);color:#fff}
.btn.pri:hover{background:#2c2c33}
.btn.sec{background:var(--fill);color:var(--label)}
.btn.sec:hover{background:var(--fill2)}
.btn.plain{padding:0 8px;color:var(--label);font-weight:600}
.btn.red{color:var(--red)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:16px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-green{background:var(--greenF);color:var(--green)}.b-orange{background:var(--orangeF);color:var(--orange)}
.b-blue{background:var(--blueF);color:var(--blue)}.b-slate{background:var(--slateF);color:var(--slate)}.b-red{background:var(--redF);color:var(--red)}
.b-gray{background:var(--fill);color:var(--label2)}
.sw{position:relative;width:51px;height:31px;flex:0 0 auto;appearance:none;-webkit-appearance:none;background:var(--fill2);border-radius:16px;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.sw:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{min-height:32px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--label)}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:block;padding:10px 16px}
.field+.field{border-top:1px solid var(--sep)}
.field label,.field .lbl{display:block;font-size:13px;line-height:18px;color:var(--label2);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:0;background:transparent;font-size:17px;line-height:22px;padding:2px 0;outline:0;resize:vertical}
.field textarea{min-height:120px}
.field .hint{font-size:13px;line-height:18px;color:var(--label2);margin-top:4px}
.field .hint.ok{color:var(--green)}.field .hint.bad{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--label);color:#fff}
.chip svg{width:14px;height:14px}

/* Cards */
.card{background:var(--group);border-radius:var(--r-grp);padding:20px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media (min-width:744px){.cards{grid-template-columns:repeat(4,1fr)}}
.stat .n{font:500 28px/34px var(--title);letter-spacing:-.015em;margin-top:4px}
.stat .d{font-size:13px;color:var(--green);font-weight:600;margin-top:2px}
.live{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.live .url{flex:1;min-width:200px}
.live .url b{font-size:17px;word-break:break-all}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}

/* Templates */
.tpls{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:600px){.tpls{grid-template-columns:repeat(3,1fr)}}
.tpl{background:var(--group);border-radius:var(--r-grp);overflow:hidden;text-align:left;border:2px solid transparent;transition:border-color .15s}
.tpl[aria-pressed=true]{border-color:var(--label)}
.tpl .shot{position:relative;height:200px;overflow:hidden;background:var(--fill);pointer-events:none}
.tpl .shot iframe{position:absolute;top:0;left:0;width:1280px;height:1000px;border:0;transform:scale(.27);transform-origin:0 0}
@media (max-width:599px){.tpl .shot{height:220px}.tpl .shot iframe{width:390px;height:900px;transform:scale(.6)}}
.tpl .meta{padding:12px 16px 14px;display:flex;align-items:center;gap:8px}
.tpl .meta b{font-size:17px}
.tpl .meta span{font-size:13px;color:var(--label2);display:block}
.tick{margin-left:auto;flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--label);color:#fff;visibility:hidden}
.tick svg{width:14px;height:14px}
[aria-pressed=true] .tick{visibility:visible}
.fonts{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media (min-width:744px){.fonts{grid-template-columns:repeat(3,1fr)}}
.font{background:var(--group);border-radius:var(--r-grp);padding:16px;text-align:left;border:2px solid transparent;min-height:120px;display:flex;flex-direction:column;position:relative}
.font[aria-pressed=true]{border-color:var(--label)}
.font .h{font-size:24px;line-height:28px;margin-bottom:6px}
.font .p{font-size:14px;line-height:19px;color:var(--label2)}
.font .n{margin-top:auto;padding-top:10px;font-size:13px;font-weight:600}
.font .tick{position:absolute;top:12px;right:12px}

/* Preview pane */
.pv{position:sticky;top:40px;align-self:start;display:none}
@media (min-width:1200px){.pv{display:block}}
.pv .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.frame{background:var(--group);border-radius:var(--r-grp);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.frame.desk{height:calc(100vh - 140px)}
.frame.desk iframe{width:1280px;height:calc((100vh - 140px) / .34375);transform:scale(.34375);transform-origin:0 0;border:0;display:block}
.frame.mob{width:300px;height:calc(100vh - 140px);max-height:640px;margin:0 auto;border-radius:32px;border:8px solid #121216}
.frame.mob iframe{width:390px;height:calc((100vh - 156px) / .7436);max-height:840px;transform:scale(.7436);transform-origin:0 0;border:0;display:block}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-height:92vh;border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.32,.72,0,1)}
@media (min-width:744px){.scrim{align-items:center}.sheet{max-width:600px;border-radius:var(--r-sheet);max-height:86vh}}
.sheet.full{max-width:none;height:100%;max-height:none;border-radius:0}
@media (min-width:744px){.sheet.full{max-width:1100px;height:92vh;border-radius:var(--r-sheet)}}
.sheet header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 8px;border-bottom:1px solid var(--sep)}
.sheet header b{font-size:17px;font-weight:600;text-align:center}
.sheet header .r{justify-self:end}
.sheet .body{overflow:auto;padding:20px 16px 32px;flex:1}
.sheet .body>.sec:last-child{margin-bottom:0}
@media (min-width:744px){.sheet .body{padding:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Setup wizard */
.wiz{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.wiz header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--sep);background:var(--chrome);backdrop-filter:blur(20px)}
.wiz header .steps{flex:1;display:flex;gap:6px;max-width:320px;margin:0 auto}
.wiz header .steps i{flex:1;height:4px;border-radius:2px;background:var(--fill2)}
.wiz header .steps i.on{background:var(--label)}
.wiz .body{flex:1;overflow:auto;padding:28px 16px 40px}
.wiz .body .col{max-width:640px}
.wiz footer{display:flex;gap:12px;justify-content:space-between;padding:12px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--sep);background:var(--chrome);backdrop-filter:blur(20px)}
.wiz footer .btn.pri{flex:1;max-width:320px;margin-left:auto}
.kicker{font-size:13px;font-weight:600;color:var(--label2);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--label);color:#fff;font-size:15px;font-weight:500;padding:10px 18px;border-radius:999px;animation:up .25s}
@media (min-width:1024px){.toast{bottom:32px}}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding:16px 4px 0}
.bars i{flex:1;background:var(--label);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.85}
.bars i:last-child{opacity:1}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--label3);padding:6px 4px 0}
.quote{font-size:17px;line-height:24px;padding:12px 16px 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:12px 16px;font-size:15px}
.kv dt{color:var(--label2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Website">
    <div class="brand"><img src="favicon.png" alt=""><div><b>My website</b><span>YachtWay</span></div></div>
    <div id="railNav"></div>
    <div class="grow"></div>
    <a class="nav" id="railLive" target="_blank" rel="noopener"></a>
    <div class="who"><img src="img/e03f1e2e46ddd9795477f0acc4f5c009.webp" alt=""><div><div class="sub hl">Adrian Cole</div><div class="cap m2">APEX Yacht Group</div></div></div>
  </nav>
  <div>
    <div class="topbar"><b id="topTitle">My website</b><a class="btn sec sm" id="topLive" target="_blank" rel="noopener">View page</a></div>
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Website"></nav>
</div>
<div id="layer"></div>

  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

let pvMode = 'desk';
const preview = () => `<aside class="pv" aria-label="Live preview"><div class="bar"><span class="fn hl m2">Live preview</span><div class="seg" role="group" aria-label="Preview size"><button data-pv="desk" aria-pressed="${pvMode==='desk'}">Desktop</button><button data-pv="mob" aria-pressed="${pvMode==='mob'}">Mobile</button></div></div><div class="frame ${pvMode}"><iframe class="live-pv" src="${S.template}.html" title="Live preview"></iframe></div></aside>`;
function applyPreview(f){
  let d; try { d = f.contentDocument; } catch { return; }
  if (!d || !d.body) return;
  const fp = FONTS[S.font];
  let st = d.getElementById('cms-font');
  if (!st) { st = d.createElement('style'); st.id = 'cms-font'; d.head.appendChild(st);
    const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = document.querySelector('link[href*="DM+Serif"]').href; d.head.appendChild(l); }
  st.textContent = `*{font-family:'${fp.b}',system-ui,sans-serif!important}h1,h2,h3,h4,[style*="Poppins"],[style*="Poppins"] *{font-family:'${fp.h}',Georgia,serif!important}`;
  const tpl = TEMPLATES[S.template];
  const swap = [[tpl.headline, S.headline], [DEFAULTS().intro, S.intro]];
  const w = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) {
    if (n.__orig === undefined) n.__orig = n.nodeValue.trim();
    for (const [from, to] of swap) if (from && n.__orig === from) n.nodeValue = to || from;
  }
}
const refreshPreview = () => document.querySelectorAll('iframe.live-pv').forEach(applyPreview);

/* ---------- Sheets and toasts ---------- */
let sheetOpts = {};
function sheet(title, html, opts={}){
  sheetOpts = opts;
  const layer = document.getElementById('layer');
  layer.innerHTML = `<div class="scrim" data-act="close"><div class="sheet ${opts.full?'full':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header>${opts.back?'<button class="btn plain" data-act="back">Back</button>':'<span></span>'}<b>${esc(title)}</b><button class="btn plain r" data-act="done">Done</button></header><div class="body">${html}</div></div></div>`;
  layer.querySelector('.sheet').addEventListener('click', e => e.stopPropagation(), true);
  const first = layer.querySelector('.body input:not([disabled]),.body textarea,.body button');
  (first||layer.querySelector('[data-act=done]')).focus({preventScroll:true});
  layer.querySelectorAll('iframe.live-pv').forEach(f => f.addEventListener('load', () => applyPreview(f)));
}
const closeSheet = () => { document.getElementById('layer').innerHTML = ''; sheetOpts = {}; };
function openEditor(k){ const e = EDITORS[k](); sheet(e.title, e.body, {onClose:()=>{ if (route()[1]) location.hash = '#'+route()[0]; }}); }
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.role = 'status'; d.textContent = t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2200); }

/* ---------- Render ---------- */
function render(){
  const [r, sub] = route();
  chrome();
  const main = document.getElementById('view');
  if (r === 'setup') { main.innerHTML = V.home(); document.getElementById('layer').innerHTML = setupView(); bindIframes(); return; }
  if (document.querySelector('.wiz')) closeSheet();
  main.innerHTML = (V[r] || V.home)();
  bindIframes();
  if (r === 'edit' && sub && EDITORS[sub]) openEditor(sub);
}
function bindIframes(){ document.querySelectorAll('iframe.live-pv').forEach(f => f.addEventListener('load', () => applyPreview(f))); }
addEventListener('hashchange', () => { closeSheet(); render(); scrollTo(0,0); });

/* ---------- Events ---------- */
const setPath = (path, val) => { const ks = path.split('.'); let o = S; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = val; };
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { setPath(t.dataset.f, t.value); save(); refreshPreview();
    if (t.dataset.f === 'bio') { const w = words(t.value), h = document.getElementById('bioHint'); h.className = 'hint' + (w>=40?' ok':''); h.textContent = w>=40 ? `${w} words` : `${w} words. Add ${40-w} more words.`; }
    if (t.dataset.f === 'headline' && t.nextElementSibling) t.nextElementSibling.textContent = `${t.value.length} of 60 characters`;
  }
  if (t.id === 'f-slug') { const v = t.value.toLowerCase(), h = document.getElementById('slugHint');
    const ok = /^[a-z0-9-]{3,60}$/.test(v), res = RESERVED.includes(v);
    h.className = 'hint ' + (ok && !res ? 'ok' : 'bad');
    h.textContent = !ok ? 'Use 3 to 60 letters, numbers or dashes.' : res ? 'This address is reserved. Try another.' : 'This address is free.';
    if (ok && !res) { S.slug = v; save(); } }
  if (t.id === 'f-vid') { const h = document.getElementById('vidHint'), ok = /(youtube\.com\/(watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)[\w-]{11}/.test(t.value);
    h.className = 'hint ' + (t.value ? (ok?'ok':'bad') : ''); h.textContent = !t.value ? 'Paste a YouTube link.' : ok ? 'Link checked' : 'This does not look like a YouTube link yet.'; }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.tg; if (!k) return;
  const v = e.target.checked, [a, b] = k.split('.');
  if (a === 'boat') { S.boats.find(x=>x.id==b).on = v; }
  else if (a === 'review') { S.reviews.find(x=>x.id==b).on = v; }
  else if (a === 'autoBoats') { S.autoBoats = v; }
  else setPath(k, v);
  save();
  if (a === 'boat' && !document.querySelector('.wiz')) render();
  if (a === 'boat' && document.querySelector('.wiz')) document.getElementById('layer').innerHTML = setupView();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-on],[data-tpl],[data-font],[data-pv],[data-lf],[data-rg],[data-svc],[data-cust],[data-feat],[data-wiz],[data-photos],[data-delvid],[data-delshow]');
  if (!el) return;
  const d = el.dataset, inWiz = !!document.querySelector('.wiz');
  if (d.tpl) { S.template = d.tpl; if (TEMPLATES[d.tpl].headline && Object.values(TEMPLATES).some(t=>t.headline===S.headline)) S.headline = TEMPLATES[d.tpl].headline; save(); inWiz ? document.getElementById('layer').innerHTML = setupView() : render(); return; }
  if (d.font) { S.font = d.font; save(); inWiz ? document.getElementById('layer').innerHTML = setupView() : render(); return; }
  if (d.pv) { pvMode = d.pv; render(); return; }
  if (d.lf) { leadFilter = d.lf; render(); return; }
  if (d.rg) { range = +d.rg; render(); return; }
  if (d.wiz) { step = Math.max(0, Math.min(3, step + +d.wiz)); S.setupDone = true; save(); document.getElementById('layer').innerHTML = setupView(); document.querySelector('.wiz .body').scrollTo(0,0); return; }
  if (d.svc) { const i = S.services.indexOf(d.svc); i < 0 ? S.services.push(d.svc) : S.services.splice(i,1); save(); openEditor('services'); return; }
  if (d.cust) { S.custom.splice(+d.cust,1); save(); openEditor('services'); return; }
  if (d.feat) { S.boats.forEach(b=>b.featured = b.id==d.feat); save(); openEditor('featured'); render(); return; }
  if (d.delvid) { S.videos.splice(+d.delvid,1); save(); openEditor('videos'); return; }
  if (d.delshow) { S.shows = S.shows.filter(s=>s.id!=d.delshow); save(); openEditor('shows'); return; }
  if (d.photos) { const b = S.boats.find(x=>x.id==d.photos);
    sheet('Photos for this boat', `${sec(esc(b.name), `<div class="field"><label for="f-ph">Drive or Dropbox folder link</label><input id="f-ph" inputmode="url" placeholder="https://drive.google.com/..."><div class="hint">One link, one boat. The folder should hold only this boat.</div></div>`)}`,
      {done:()=>{ const v = document.getElementById('f-ph').value.trim(); if (!v) return true;
        if (!/^https?:\/\/([\w-]+\.)?(drive\.google\.com|dropbox\.com)\//i.test(v)) { toast('Paste a Google Drive or Dropbox link'); return false; }
        b.photos = 'queued'; save(); render(); toast('Photos in line'); return true; }}); return; }
  if (d.on) { const [kind, id] = d.on.split(':');
    if (kind === 'lead') return leadSheet(id);
    if (kind === 'show') return showEditor(id);
    if (kind === 'toast') return toast(d.on.slice(6));
    if (kind === 'photoshoot') return sheet('Book a photoshoot', sec('Pick a listing', S.boats.filter(b=>b.on).map(b=>row({t:esc(b.name),img:`<img class="thumb" src="${IMG+b.img}" alt="">`,on:'toast:Photoshoot request sent'})).join(''), 'Photos, video and a 3D Tour. We confirm the date by email.'));
    if (kind === 'add') return toast(ADD_WAYS.find(w=>w[0]===id)[1] + ' opens the listing tool');
  }
  switch (d.act) {
    case 'close': if (e.target === el) { const cb = sheetOpts.onClose; closeSheet(); cb && cb(); } return;
    case 'done': { const ok = sheetOpts.done ? sheetOpts.done() : true; if (ok !== false) { const cb = sheetOpts.onClose; closeSheet(); render(); cb && cb(); } return; }
    case 'back': sheetOpts.back && sheetOpts.back(); return;
    case 'copy': navigator.clipboard?.writeText('https://' + pageUrl()).catch(()=>{}); toast('Link copied'); return;
    case 'publish': S.published = true; save(); step = 0; location.hash = '#home'; toast('Your page is live'); return;
    case 'unpublish': S.published = false; save(); render(); toast('Your page is offline'); return;
    case 'domain': { const v = document.getElementById('f-domain').value.trim().toLowerCase();
      if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(v)) { toast('Enter a domain like yourname.com'); return; }
      S.domain = v; S.domainStatus = 'requested'; save(); render(); toast('Domain requested'); return; }
    case 'rmdomain': S.domain = null; S.domainStatus = null; save(); render(); return;
    case 'addsvc': { const i = document.getElementById('f-cust'), v = i.value.trim(); if (v) { S.custom.push(v); save(); openEditor('services'); } return; }
    case 'addvid': { const i = document.getElementById('f-vid'), m = i.value.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
      if (!m) { toast('Paste a YouTube link'); return; } if (S.videos.length >= 6) { toast('Up to 6 videos'); return; }
      S.videos.push({url:'https://youtu.be/'+m[1],title:'New video'}); save(); openEditor('videos'); return; }
    case 'bio': S.bio = `I have sold boats in South Florida since 2018, with 120 sales from 40 to 90 feet. I know Azimut, Sunseeker and Princess inside out, and I walk every boat I list in person. Owners pick me because I price from real sold data, run every showing myself and handle the survey, paperwork and closing so the sale stays calm.`;
      save(); inWiz ? document.getElementById('layer').innerHTML = setupView() : openEditor('about'); toast('Draft added. Make it yours.'); return;
    case 'addboat': sheet('Add a boat', sec('Pick the easiest way', ADD_WAYS.map(([k,t,d,ic])=>row({t,d,ic,on:'add:'+k})).join(''), 'You can add more later.')); return;
    case 'preview': {
      sheet('Preview', `<div style="display:flex;justify-content:center;margin-bottom:16px"><div class="seg" role="group" aria-label="Preview size"><button data-pvs="mob" aria-pressed="true">Mobile</button><button data-pvs="desk" aria-pressed="false">Desktop</button></div></div><div id="pvs" style="height:calc(100% - 52px);display:flex;justify-content:center"><iframe class="live-pv" src="${S.template}.html" title="Preview" style="width:390px;max-width:100%;height:100%;border:0;border-radius:16px;background:#fff"></iframe></div>`, {full:true});
      document.querySelector('.sheet .body').style.cssText = 'padding:16px;overflow:hidden;display:flex;flex-direction:column';
      document.querySelectorAll('[data-pvs]').forEach(b => b.onclick = () => { document.querySelectorAll('[data-pvs]').forEach(x=>x.setAttribute('aria-pressed', x===b)); document.querySelector('#pvs iframe').style.width = b.dataset.pvs==='mob' ? '390px' : '100%'; });
      return; }
  }
  if (d.act && d.act.startsWith('toast:')) toast(d.act.slice(6));
});
addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.scrim')) { const cb = sheetOpts.onClose; closeSheet(); cb && cb(); } });
render();
</script>
</body>
</html>
